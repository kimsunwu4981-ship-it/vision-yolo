device: auto
# Batch=1 baseline was measured; ready-only batch<=4 improves the 4-channel desktop profile.
microbatch: 4
imgsz: 640
confidence: 0.25
# Weak observations may maintain an existing person track, never create a new one.
tracking_low_confidence: 0.10
inference_cpu_threads: 1
# Localize observed body parts on bounded current-frame person crops.
max_body_people_per_frame: 8
body_min_person_height: 90
half: true
preview_width: 960
preview_fps: 12
observation_ttl_s: 1.0
storage:
  pre_seconds: 3
  post_seconds: 3
  buffer_mb: 64
  clip_mb: 16
  max_pending_clips: 8
  retention_days: 14
  max_gb: 10
  min_free_gb: 2
